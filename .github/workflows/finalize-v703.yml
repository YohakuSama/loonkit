name: Finalize v7.0.3 routing release candidate
on:
  push:
    branches:
      - refactor/v701-unified-routing-candidate
    paths:
      - scripts/publish_v703_candidate.py
      - .github/workflows/finalize-v703.yml
permissions:
  contents: write
jobs:
  finalize:
    if: github.ref == 'refs/heads/refactor/v701-unified-routing-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Freeze reviewed ChinaDirect exclusions into an immutable asset commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 scripts/publish_v703_candidate.py --prepare-assets
          git add rules/releases/v7.0.3/ChinaDirect.lsr
          if git diff --cached --quiet; then
            echo 'Expected ChinaDirect correction was not staged'
            exit 1
          fi
          git commit -m 'assets: remove foreign commerce from ChinaDirect v7.0.3'
          echo "ASSET_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
      - name: Render profile and all formal release metadata against frozen asset SHA
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/publish_v703_candidate.py --finalize --asset-commit "$ASSET_SHA"
          python3 scripts/release_v703.py --check
          python3 scripts/verify_release.py --check
          python3 scripts/audit_upstream_703.py --candidate build/candidates/v7.0.3
          python3 -m unittest discover -s tests -p 'test_*.py' -q
      - name: Commit and push complete release candidate
        shell: bash
        run: |
          set -euo pipefail
          git add LoonKit.lcf README.md rules/README.md build docs release
          git commit -m 'release: prepare v7.0.3 with 43 immutable Loon rule sets'
          git push origin HEAD:refactor/v701-unified-routing-candidate
