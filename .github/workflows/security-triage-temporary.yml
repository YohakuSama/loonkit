name: Temporary CodeQL Alert Triage
on:
  pull_request:
    branches: [main]
    paths:
      - 'scripts/v20261025r2/**'
      - '.github/workflows/security-triage-temporary.yml'
permissions:
  contents: read
  checks: read
jobs:
  triage:
    runs-on: ubuntu-latest
    steps:
      - name: Print CodeQL check annotation titles and locations only
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          gh api "repos/$REPO/check-runs/121212599072/annotations?per_page=100" --jq '.[] | [.title,.path,.start_line,.annotation_level] | @tsv'
