name: StashKit validation

on:
  pull_request:
    paths:
      - 'stashkit/**'
      - '.github/workflows/stashkit-ci.yml'
      - 'LoonKit.lcf'
      - 'build/release_manifest.json'
      - 'rules/releases/**'
  push:
    branches: [main]
    paths:
      - 'stashkit/**'
      - '.github/workflows/stashkit-ci.yml'
      - 'LoonKit.lcf'
      - 'build/release_manifest.json'
      - 'rules/releases/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install YAML parser
        run: python -m pip install 'PyYAML>=6,<7'
      - name: Validate all source and Stash rule assets
        run: python stashkit/scripts/verify.py
