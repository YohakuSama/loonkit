name: LoonKit Production CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Locked inputs and bit-exact published output
        run: |
          python3 scripts/source_lock.py --check
          python3 scripts/verify_release.py --check
          python3 scripts/prepare_promoted_release.py --check
          python3 scripts/release_promotion_gate.py --assert-template-blocked
          python3 scripts/prepare_release_v656.py --check
      - name: Validate all immutable Raw resources and content hashes
        run: python3 scripts/verify_release.py --check --remote
      - name: Verify rule rebuild is independent of Python hash seed
        run: |
          for seed in 0 1 42 2026; do
            PYTHONHASHSEED="$seed" python3 scripts/verify_release.py --check
          done
      - name: Read-only historical cleanup inventory
        run: python3 scripts/beta_cleanup.py
      - name: Verify historical pinned rollback resources before any deletion
        run: python3 scripts/beta_cleanup.py --verify-archives
      - name: Third-party license evidence
        run: |
          python3 scripts/license_audit.py --check
          python3 scripts/license_evidence.py --check
      - name: Python regression tests (real assertions)
        run: python3 -m unittest discover -s tests -p 'test_*.py' -v
      - name: Audit unified routing candidate and cross-policy coverage
        run: python3 scripts/routing_candidate_audit.py --check
      - name: Upstream sample routes and domestic AI inventory
        run: python3 scripts/audit_upstream_703.py
      - name: Audit v7.0.2 scoped LSR resources and icon directory
        run: python3 scripts/audit_v702.py --check
      - name: Native Loon mocked-response regressions
        run: node --test tests/diagnostics.test.cjs
      - name: Native plugin JavaScript syntax
        run: |
          node --check scripts/v20261022r11/node-intelligence.js
          node --check scripts/v20261022r11/network-diagnostics.js
          node --check scripts/v20261022r11/media-unlock.js
      - name: Native results are concise without changing probes
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const read = p => fs.readFileSync(p, 'utf8');
          const media = read('scripts/v20261022r11/media-unlock.js');
          const node = read('scripts/v20261022r11/node-intelligence.js');
          const network = read('scripts/v20261022r11/network-diagnostics.js');
          const plugin = read('release/Network_Diagnostics.plugin');
          assert(!media.includes('7 项平台检测'));
          for (const word of ['DAZN','Discovery+','Paramount+','Disney+','Netflix','ChatGPT','YouTube Premium']) assert(media.includes(word));
          assert(media.includes('test(it[0]') && media.includes('setTimeout(done,22000)'));
          assert(node.includes('风险评分') && node.includes('网络特征'));
          assert(network.includes('连接状态') && network.includes('nativeDns('));
          assert.equal((plugin.match(/^generic then script\(/gm)||[]).length,3);
          assert.equal((plugin.match(/^network-changed then script\(/gm)||[]).length,1);
          JS
      - name: No mutation of production content
        run: |
          git diff --exit-code -- LoonKit.lcf LoonKit.PrivacyDNS.lcf rules/releases/ icons/ plugins/
          test -z "$(git status --porcelain)"
