name: LoonKit Production CI
on:
  push:
    branches: [main, refactor/v701-unified-routing-candidate]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  production:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '22'
      - name: Locked inputs and byte-exact current publication
        run: |
          python3 scripts/source_lock.py --check
          python3 scripts/verify_release.py --check
      - name: Current third-party license gate
        run: python3 scripts/license_audit.py --check
      - name: Active production regression tests
        run: python3 scripts/test_suites.py current
      - name: Simulate two successive releases without publication (isolated Git clone)
        run: |
          set -euo pipefail
          git clone --local . "$RUNNER_TEMP/loonkit-upgrade"
          cd "$RUNNER_TEMP/loonkit-upgrade"
          git checkout --detach "$GITHUB_SHA"
          git -c user.name="Release CI" -c user.email="ci@example.invalid" status --porcelain
          current="$(python3 -c "import json; print(json.load(open('build/release_spec.json'))['stable_release_version'])")"
          for delta in 1 2; do
            version="$(python3 -c 'import sys; s=sys.argv[1].split("."); s[-1]=str(int(s[-1])+int(sys.argv[2])); print(".".join(s))' "$current" "$delta")"
            python3 scripts/release_engine.py --start-next "$version"
            python3 scripts/release_engine.py --check
            python3 scripts/verify_release.py --check
            python3 -m unittest discover -s tests -p 'test_release_engine.py' -v
            git add -A
            git -c user.name="Release CI" -c user.email="ci@example.invalid" commit -qm "test: simulate $version"
          done
      - name: Verify declarative release and immutable resources
        run: python3 scripts/release_engine.py --check
      - name: Native Loon mocked-response regressions
        run: node --test tests/diagnostics.test.cjs tests/diagnostics.retry.test.cjs
      - name: Native plugin JavaScript syntax
        run: |
          node --check scripts/v20261025r3/node-intelligence.js
          node --check scripts/v20261025r1/network-diagnostics.js
          node --check scripts/v20261025r2/media-unlock.js
          node --check scripts/v20261026r1/node-intelligence.js
          node --check scripts/v20261026r1/network-diagnostics.js
          node --check scripts/v20261026r1/media-unlock.js
      - name: Native results are concise and node-scoped
        run: |
          node - <<'JS'
          const fs = require('node:fs');
          const assert = require('node:assert/strict');
          const read = p => fs.readFileSync(p, 'utf8');
          const media = read('scripts/v20261025r2/media-unlock.js');
          const node = read('scripts/v20261025r3/node-intelligence.js');
          const network = read('scripts/v20261025r1/network-diagnostics.js');
          const plugin = read('release/Network_Diagnostics.plugin');
          assert(!media.includes('7 项平台检测'));
          for (const word of ['DAZN','Discovery+','Paramount+','Disney+','Netflix','ChatGPT','YouTube Premium']) assert(media.includes(word));
          assert(media.includes('test(it[0]') && media.includes('setTimeout(done,22000)'));
          assert(node.includes('出口 IP：') && node.includes('IP 网段：') && node.includes('反向 DNS：'));
          assert(node.includes('机房 / 云：') && node.includes('VPN / 代理：'));
          assert(node.includes('https://ipconfig.is/json'));
          assert(media.includes('✅') && media.includes('⛔') && media.includes('⚠️'));
          assert(!node.includes('风险评分'));
          assert(network.includes('连接状态') && network.includes('nativeDns('));
          assert.equal((plugin.match(/^generic then script\(/gm)||[]).length,3);
          assert.equal((plugin.match(/^network-changed then script\(/gm)||[]).length,0);
          assert(!plugin.includes('auto_check'));
          assert(!media.includes('/users/me'));
          assert(network.includes('DIRECT_URL,"DIRECT"'));
          assert(media.includes('resolveNode()'));
          assert(!node.includes('ipquery.io') && !node.includes('ipwho.is'));
          assert(node.includes('入口：') && node.includes('运营商：'));

          JS
      - name: No mutation of production content
        run: |
          git diff --exit-code -- LoonKit.lcf LoonKit.PrivacyDNS.lcf rules/releases/ icons/ plugins/
          test -z "$(git status --porcelain)"
