name: Prepare new App Store policy icons
on:
  push:
    branches: [refactor/v701-unified-routing-candidate]
    paths:
      - scripts/build_appstore_icons.py
      - .github/workflows/prepare-appstore-icons.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/refactor/v701-unified-routing-candidate'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - name: Install image processor
        run: python3 -m pip install Pillow==12.0.0
      - name: Generate and verify Apple Store icons
        run: |
          python3 scripts/build_appstore_icons.py
          python3 scripts/build_appstore_icons.py --check
      - name: Commit normalized artwork to candidate branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add icons/v20261025r1
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'assets: add six uniform App Store strategy icons'
          git push origin HEAD:refactor/v701-unified-routing-candidate
