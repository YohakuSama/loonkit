name: Upstream Review (read only)
on:
  schedule:
    - cron: '20 2 * * 1'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - run: python3 scripts/verify_release.py --check
      - name: Validate immutable pinned resources on GitHub Raw
        run: python3 scripts/verify_release.py --check --remote
      - name: Fetch, normalize, deduplicate and analyze upstream changes (review only)
        run: python3 scripts/upstream_review.py --output "$RUNNER_TEMP/upstream-review"
      - name: Verify candidate preview remains exactly pinned and summarize risks
        run: |
          python3 - <<'PY'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0,'scripts')
          from upstream_review import runtime_baseline
          base=Path.cwd()
          directory=Path(os.environ["RUNNER_TEMP"])/"upstream-review"
          report=json.loads((directory/"UPSTREAM_REVIEW.json").read_text())
          assert report["publication_allowed"] is False
          assert report["preview_sha256_unchanged"] is True
          baseline=runtime_baseline(base)
          assert set(report["groups"]) == set(baseline)
          for group in report["groups"]:
              name="AnimeCrazy" if group=="動畫瘋" else group
              def rules(path):
                  return {line.strip() for line in path.read_text().splitlines()
                          if line.strip() and not line.lstrip().startswith(("#",";","//"))}
              old=baseline[group]
              preview=rules(directory/"candidate"/(name+".list"))
              assert old==preview, "unapproved changed preview: "+group
          additions=sum(g["added"] for g in report["groups"].values())
          deletions=sum(g["removed"] for g in report["groups"].values())
          with open(os.environ["GITHUB_STEP_SUMMARY"],"a",encoding="utf-8") as fd:
              fd.write("## Upstream rule review (not publishable)\n")
              fd.write(f"Sources requiring review: {report['incomplete_sources']}\n")
              fd.write(f"Proposed additions: {additions}; proposed deletions: {deletions}\n")
              fd.write(f"All {len(baseline)} candidate previews match the reviewed service scopes.\n")
          PY
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: upstream-safe-candidates-only
          path: |
            ${{ runner.temp }}/upstream-review/
          retention-days: 7
          if-no-files-found: error
      - name: Require complete upstream source coverage after uploading evidence
        if: always()
        run: |
          python3 scripts/verify_upstream_coverage.py \
            --catalog rules/sources.json \
            --report "$RUNNER_TEMP/upstream-review/UPSTREAM_REVIEW.json"
