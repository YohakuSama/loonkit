<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-labelledby="title desc">
  <title id="title">LoonKit</title>
  <desc id="desc">LoonKit routing and diagnostics toolkit: abstract network routes over a navy gradient background.</desc>
  <defs>
    <linearGradient id="background" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#0A1228"/>
      <stop offset="0.58" stop-color="#151E3C"/>
      <stop offset="1" stop-color="#182346"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" x2="1" y1="1" y2="0">
      <stop offset="0" stop-color="#8D71FF"/>
      <stop offset="1" stop-color="#40D7DF"/>
    </linearGradient>
    <linearGradient id="subtle" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#97A3C8" stop-opacity=".05"/>
      <stop offset="1" stop-color="#97A3C8" stop-opacity=".22"/>
    </linearGradient>
    <radialGradient id="glow">
      <stop offset="0" stop-color="#776CFF" stop-opacity=".23"/>
      <stop offset="1" stop-color="#776CFF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#9BB4DF" stroke-opacity=".065" stroke-width="1"/>
    </pattern>
    <filter id="nodeGlow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="8"/>
    </filter>
  </defs>

  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#background)"/>
  <rect x="0" y="0" width="1200" height="320" rx="20" fill="url(#grid)"/>
  <circle cx="880" cy="165" r="270" fill="url(#glow)"/>

  <!-- Monogram -->
  <rect x="75" y="73" width="87" height="87" rx="24" fill="#1D2850" stroke="#465688" stroke-width="1.3"/>
  <path d="M103 97V136H136" fill="none" stroke="url(#accent)" stroke-width="7.5" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M134 96L113 116L135 137" fill="none" stroke="#8A7DFF" stroke-width="6.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle cx="143" cy="87" r="5" fill="#5DDCDD"/>

  <!-- Brand -->
  <text x="183" y="143" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,Arial,sans-serif" font-size="67" font-weight="740" fill="#F6F8FF" letter-spacing="-2">LoonKit</text>
  <rect x="80" y="183" width="47" height="4" rx="2" fill="url(#accent)"/>
  <text x="80" y="220" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="19" font-weight="560" fill="#C6D4F2" letter-spacing="2.1">ROUTING  /  CONTROL  /  DIAGNOSTICS</text>
  <text x="80" y="257" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif" font-size="16" fill="#8493BB">A thoughtful Loon configuration toolkit</text>

  <!-- Topology lines -->
  <g fill="none" stroke-linecap="round">
    <path d="M678 160L805 100L936 160L1060 92" stroke="url(#accent)" stroke-width="3"/>
    <path d="M678 160L805 228L936 160L1070 235" stroke="#8D71FF" stroke-opacity=".88" stroke-width="2.8"/>
    <path d="M805 100L936 82L1060 92" stroke="#6476B5" stroke-opacity=".65" stroke-width="2" stroke-dasharray="5 9"/>
    <path d="M805 228L927 257L1070 235" stroke="#6476B5" stroke-opacity=".65" stroke-width="2" stroke-dasharray="5 9"/>
    <path d="M936 82V160V257" stroke="#6878AF" stroke-opacity=".45" stroke-width="1.5" stroke-dasharray="3 8"/>
  </g>
  <g fill="#101A33" stroke-width="3">
    <circle cx="678" cy="160" r="17" stroke="#7E76FF"/>
    <circle cx="805" cy="100" r="12" stroke="#42CDD8"/>
    <circle cx="805" cy="228" r="12" stroke="#8078F4"/>
    <circle cx="936" cy="160" r="23" stroke="#54D1D9"/>
    <circle cx="1060" cy="92" r="12" stroke="#7E76FF"/>
    <circle cx="1070" cy="235" r="12" stroke="#54D1D9"/>
    <circle cx="936" cy="82" r="6" stroke="#7582A9"/>
    <circle cx="927" cy="257" r="6" stroke="#7582A9"/>
  </g>
  <g fill="url(#accent)">
    <circle cx="678" cy="160" r="5"/>
    <circle cx="805" cy="100" r="3.5"/>
    <circle cx="805" cy="228" r="3.5"/>
    <circle cx="936" cy="160" r="9"/>
    <circle cx="1060" cy="92" r="3.5"/>
    <circle cx="1070" cy="235" r="3.5"/>
  </g>
  <rect x="0.75" y="0.75" width="1198.5" height="318.5" rx="19.25" fill="none" stroke="#556390" stroke-opacity=".33" stroke-width="1.5"/>
</svg>
