# StashKit v0.1.0 — port of LoonKit v7.0.10
# No nodes or private subscription URLs are bundled. Apply your own proxy-provider via an Override.
# Routing assets are generated Stash-native snapshots in this repository.
mode: rule
log-level: warning

dns:
  default-nameserver:
    - 223.5.5.5
    - 223.6.6.6
  nameserver:
    - https://dns.alidns.com/dns-query
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - geosite:private
    - '+.local'
    - 'captive.apple.com'
    - '+.apple.com'
    - '+.icloud.com'
    - 'dns.msftncsi.com'
    - '*.srv.nintendo.net'
    - '+.xboxlive.com'

proxy-groups:
  - name: "Proxy"
    type: select
    proxies:
      - Auto
      - Fallback
      - ALL
    icon: https://raw.githubusercontent.com/YohakuSama/loonkit/d82214d057b27a68d6b9c07c61fb126a69adc903/icons/Proxy.png
  - name: "Auto"
    type: url-test
    include-all: true
    proxies:
      - REJECT
    url: http://www.bing.com
    interval: 600
    tolerance: 60
    icon: https://raw.githubusercontent.com/YohakuSama/loonkit/d82214d057b27a68d6b9c07c61fb126a69adc903/icons/Auto.png
  - name: "Fallback"
    type: fallback
    include-all: true
    proxies:
      - REJECT
    url: http://www.bing.com
    interval: 900
    icon: https://raw.githubusercontent.com/YohakuSama/loonkit/d82214d057b27a68d6b9c07c61fb126a69adc903/icons/Fallback.png
